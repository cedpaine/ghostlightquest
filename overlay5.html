<!doctype html>
<html lang="en">
<head>
<!-- ChatGPT Prompts:
css, html, and javascript for a video with a circular button overlay covering 30% of the 
width of the video. There should be a full screen button that displays the entire video 
with the overlay button still in place. Center the video horizontally. In full-screen, 
show the entire height of the video.
Remove width and aspect-ratio from the css for video-container. Make video-container the 
height of the available window.
-->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Video with Circular Overlay Buttons</title>
  <style>
    body{
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      background:#111;
      font-family:Arial;
    }

    .video-container{
      position:relative;
      height:100vh; /* fill available window height */
      background:#000;
      overflow:hidden;
      margin:0 auto; /* center horizontally */
      display:flex;
      justify-content:center;
      align-items:center;
    }

    video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .yellow-btn{
      position:absolute;
      height:10.6%;           /* 10% of video height */
      aspect-ratio:1/1;    /* circle */
      border-radius:50%;
      background:rgba(255,255,255,0.7);
      top:21%;
      left:50%;
      transform:translateX(-145%);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      font-size:28px;
      font-weight:bold;
      user-select:none;
    }

    .blue-btn{
      position:absolute;
      height:10.6%;           /* 10% of video height */
      aspect-ratio:1/1;    /* circle */
      border-radius:50%;
      background:rgba(255,255,255,0.7);
      top:21%;
      left:50%;
      transform:translateX(48%);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      font-size:28px;
      font-weight:bold;
      user-select:none;
    }

    /* Fullscreen keeps buttons positioned */
    .video-container:fullscreen{
      width:100vw; */
      height:100vh;
      aspect-ratio:auto;
    }

    .controls{
      text-align:center;
      margin-top:16px;
    }
  
    /* fullscreen video should show entire height */
    .video-container:fullscreen video{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .video-container:-webkit-full-screen video{
      width:100%;
      height:100%;
      object-fit:contain;
    }
  </style>
</head>
<body>
  <div>
    <div class="video-container" id="vidBox">
      <video id="video" playsinline>
        <source src="Pause2.mp4" type="video/mp4">
      </video>
      <div class="yellow-btn" id="yellowBtn">▶</div>
      <div class="blue-btn" id="blueBtn">▶</div>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const yellowBtn = document.getElementById("yellowBtn");
    const blueBtn = document.getElementById("blueBtn");
    const vidBox = document.getElementById("vidBox");

    yellowBtn.addEventListener("click", () => {
      if (video.paused){
        vidBox.requestFullscreen();
        video.play();
        yellowBtn.textContent = "❚❚";
      } else {
        video.pause();
        document.exitFullscreen();
        yellowBtn.textContent = "▶";
      }
    });
    yellowBtn.addEventListener("click", () => {
      if (video.paused){
        vidBox.requestFullscreen();
        video.play();
        yellowBtn.textContent = "❚❚";
      } else {
        video.pause();
        document.exitFullscreen();
        yellowBtn.textContent = "▶";
      }
    });
  </script>
</body>
</html>
