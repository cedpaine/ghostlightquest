<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Video with Circular Overlay</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
    }

    :root { --vh: 1vh; }

    .video-page {
      position: fixed;
      left: 0;
      right: 0;
      top: env(safe-area-inset-top);
      bottom: env(safe-area-inset-bottom);
      height: calc(var(--vh) * 100 - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .video-wrapper {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative; /* allows overlay positioning */
    }

    video {
      display: block;
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      background: black;
      border-radius: 8px;
    }

    /* Fullscreen toggle button (bottom) */
    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .controls button {
      pointer-events: auto;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 16px;
      backdrop-filter: blur(6px);
    }

    /* --- NEW: CIRCULAR OVERLAY BUTTON --- */
    #exitFsOverlay {
      position: absolute;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
      padding: 0;
    }
  </style>
</head>

<body>

<div class="video-page">
  <div class="video-wrapper" id="wrapper">

    <!-- VIDEO -->
    <video id="player" playsinline controls preload="metadata">
      <source src="Pause1.mp4" type="video/mp4">
    </video>

    <!-- CIRCULAR OVERLAY (always visible) -->
    <div id="exitFsOverlay">X</div>

  </div>

  <div class="controls">
    <button id="fsBtn">Enter Fullscreen</button>
  </div>
</div>

<script>

/* -------------------------------
   Dynamic Mobile Viewport Fix
---------------------------------*/
function setVh() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty("--vh", `${vh}px`);
}
setVh();
window.addEventListener("resize", setVh);
window.addEventListener("orientationchange", () => setTimeout(setVh, 150));
if (window.visualViewport) {
  visualViewport.addEventListener("resize", setVh);
  visualViewport.addEventListener("scroll", setVh);
}

/* -------------------------------
   Fullscreen Controls
---------------------------------*/
const fsBtn = document.getElementById("fsBtn");
const overlay = document.getElementById("exitFsOverlay");
const player = document.getElementById("player");
const wrapper = document.getElementById("wrapper");

async function enterFullscreen() {
  try {
    if (player.requestFullscreen) await player.requestFullscreen();
    else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
    else if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
  } catch (err) {}
}

async function exitFullscreen() {
  try {
    if (document.exitFullscreen) await document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch (err) {}
}

fsBtn.addEventListener("click", () => {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFs) enterFullscreen();
  else exitFullscreen();
});

document.addEventListener("fullscreenchange", () => {
  const isFs = document.fullscreenElement;
  fsBtn.textContent = isFs ? "Exit Fullscreen" : "Enter Fullscreen";
  updateOverlayPosition();
});


/* -------------------------------
   Position Overlay Relative to Video
   - diameter = 10% of video height
   - top = 25% of video height
   - centered horizontally
---------------------------------*/
function updateOverlayPosition() {
  const rect = player.getBoundingClientRect();

  const videoHeight = rect.height;
  const videoWidth = rect.width;

  const diameter = videoHeight * 0.10;       // 10% height
  const topPos = rect.top + videoHeight * 0.25;  // 25% from top of video
  const leftPos = rect.left + (videoWidth / 2) - (diameter / 2);

  overlay.style.width = `${diameter}px`;
  overlay.style.height = `${diameter}px`;
  overlay.style.lineHeight = `${diameter}px`; // for centered text
  overlay.style.top = `${topPos}px`;
  overlay.style.left = `${leftPos}px`;
}

window.addEventListener("resize", updateOverlayPosition);
window.addEventListener("orientationchange", () => setTimeout(updateOverlayPosition, 150));

player.addEventListener("loadedmetadata", updateOverlayPosition);
player.addEventListener("play", updateOverlayPosition);
player.addEventListener("pause", updateOverlayPosition);

if (window.visualViewport) {
  visualViewport.addEventListener("resize", updateOverlayPosition);
  visualViewport.addEventListener("scroll", updateOverlayPosition);
}

/* When overlay is tapped, exit fullscreen */
overlay.addEventListener("click", exitFullscreen);

</script>
</body>
</html>
