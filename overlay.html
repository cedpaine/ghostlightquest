<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portrait 9:16 Video Player</title>

<style>
  :root {
    /* Play button = 10% of visible screen height */
    --btn-size: 10vh;
  }

  body {
    margin:0;
    padding:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100dvh;              /* dynamic viewport height */
  }

  /* -----------------------------------------
     Video container: height is dynamically set
     to the REAL visible viewport height via JS
     ----------------------------------------- */
  .video-viewport {
    position:relative;
    width:100%;
    max-width:500px;             /* optional */
    background:black;
    overflow:hidden;
    border-radius:12px;
    touch-action:manipulation;
  }

  /* Maintain 9:16 shape when *not* fullscreen */
  .video-viewport:not(.fs-mode) {
    aspect-ratio:9/16;
  }

  /* -----------------------------------------
     Video always shows FULL HEIGHT (no crop)
     ----------------------------------------- */
  video {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;          /* <-- ensures full height always visible */
    background:black;            /* <-- black bars on sides */
    pointer-events:none;         /* UI must sit above video */
  }

  /* -----------------------------------------
     Play button
     ----------------------------------------- */
  #playBtn {
    position:absolute;
    top:47.8%;
    left:50%;                    /* 25% from left (your request) */
    transform:translateX(-50%);
    width:var(--btn-size);
    height:var(--btn-size);
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    color:black;
    font-weight:600;
    font-size:20px;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }

  /* -----------------------------------------
     FULLSCREEN OVERRIDES
     Preserve portrait fit + full-height visible
     ----------------------------------------- */

  :fullscreen .video-viewport,
  :-webkit-full-screen .video-viewport {
    width:100vw;
    height:100vh;
    border-radius:0;
  }

  :fullscreen video,
  :-webkit-full-screen video {
    width:100%;
    height:100%;
    object-fit:contain;          /* still pillarboxed */
    background:black;
  }

  :fullscreen #playBtn,
  :-webkit-full-screen #playBtn {
    width:10vh;
    height:10vh;
  }
</style>
</head>
<body>

<div class="video-viewport" id="viewport">
  <video id="video"
         playsinline
         webkit-playsinline
         preload="auto"
         src="Pause1.mp4"></video>

  <button id="playBtn">▶</button>
</div>

<script>
  const viewport = document.getElementById("viewport");
  const video = document.getElementById("video");
  const playBtn = document.getElementById("playBtn");

  /* ---------------------------------------------------
     1. FORCE PORTRAIT ORIENTATION IN FULLSCREEN
     --------------------------------------------------- */
  function lockPortrait() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("portrait").catch(() => {});
    }
  }

  /* ---------------------------------------------------
     2. UNIVERSAL FULLSCREEN ENTRY
     --------------------------------------------------- */
  async function enterFullscreen() {
    lockPortrait();

    // iPhone native fullscreen
    if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
      return;
    }

    // Standard fullscreen
    const req =
      viewport.requestFullscreen ||
      viewport.webkitRequestFullscreen ||
      viewport.mozRequestFullScreen ||
      viewport.msRequestFullscreen;

    if (req) req.call(viewport);
  }

  /* ---------------------------------------------------
     3. ALWAYS FIT VIDEO TO THE *REAL VISIBLE SCREEN*
     (Works on iPhone Safari dynamic viewport)
     --------------------------------------------------- */
  function resizeViewport() {
    const visibleHeight = window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;

    viewport.style.height = visibleHeight + "px";
  }

  /* Initial sizing */
  resizeViewport();

  /* Update on any viewport change */
  window.visualViewport?.addEventListener("resize", resizeViewport);
  window.addEventListener("orientationchange", () => {
    setTimeout(resizeViewport, 300); // allow UI bars to animate
  });
  document.addEventListener("fullscreenchange", resizeViewport);

  /* ---------------------------------------------------
     4. PLAY BUTTON BEHAVIOR
     --------------------------------------------------- */
  playBtn.addEventListener("click", async () => {
    // Toggle play/pause
    if (video.paused) {
      await video.play();
      playBtn.textContent = "❚❚";
    } else {
      video.pause();
      playBtn.textContent = "▶";
    }

    // Enter fullscreen always
    enterFullscreen();
  });

  video.addEventListener("play", () => {
    playBtn.textContent = "❚❚";
  });

  video.addEventListener("pause", () => {
    playBtn.textContent = "▶";
  });
</script>

</body>
</html>
