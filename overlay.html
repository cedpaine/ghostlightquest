<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ghostlight Quest Game</title>

<style>
  :root {
    /* Play button = 10.6% of visible screen height */
    --btn-size: 10.6vh;
  }

  body {
    margin:0;
    padding:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100dvh;              /* dynamic viewport height */
  }

  /* -----------------------------------------
     Video container: height is dynamically set
     to the REAL visible viewport height via JS
     ----------------------------------------- */
  .video-viewport {
    position:relative;
    width:100%;
    max-width:500px;             /* optional */
    background:black;
    overflow:hidden;
    border-radius:12px;
    touch-action:manipulation;
  }

  /* Maintain 9:16 shape when *not* fullscreen */
  .video-viewport:not(.fs-mode) {
    aspect-ratio:9/16;
  }

  /* -----------------------------------------
     Video always shows FULL HEIGHT (no crop)
     ----------------------------------------- */
  video {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;          /* <-- ensures full height always visible */
    background:black;            /* <-- black bars on sides */
    pointer-events:none;         /* UI must sit above video */
  }

  /* -----------------------------------------
     Buttons
     ----------------------------------------- */
  #playBtn {
    position:absolute;
    top:47.5%;
    left:50%;                    /* 50% from left of video*/
    transform:translateX(-50%);  /* left 50% the width of the button */
    width:var(--btn-size);
    height:var(--btn-size);
    border-radius:50%;
    background:rgba(255,255,255,0);
    color:black;
    font-weight:600;
    font-size:30px;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  
  #yellowBtn {
    position:absolute;
    top:0%;
    left:50%;                    /* 50% from left of video*/
    transform:translateX(-145%);  /* left 145% the width of the button */
    width:var(--btn-size);
    height:var(--btn-size);
    border-radius:50%;
    background:rgba(255,255,255,0);
    color:black;
    font-weight:600;
    font-size:30px;
    border:none;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }
  
  #blueBtn {
    position:absolute;
    top:0%;
    left:50%;                    /* 50% from left of video*/
    transform:translateX(48%);  /* right 48% the width of the button */
    width:var(--btn-size);
    height:var(--btn-size);
    border-radius:50%;
    background:rgba(255,255,255,0);
    color:black;
    font-weight:600;
    font-size:30px;
    border:none;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:20;
  }

  /* -----------------------------------------
     FULLSCREEN OVERRIDES
     Preserve portrait fit + full-height visible
     ----------------------------------------- */

  :fullscreen .video-viewport,
  :-webkit-full-screen .video-viewport {
    width:100vw;
    height:100vh;
    border-radius:0;
  }

  :fullscreen video,
  :-webkit-full-screen video {
    width:100%;
    height:100%;
    object-fit:contain;          /* still pillarboxed */
    background:black;
  }

  :fullscreen #playBtn,
  :-webkit-full-screen #playBtn {
    width:10.6vh;
    height:10.6vh;
  }

  :fullscreen #yellowBtn,
  :-webkit-full-screen #yellowBtn {
    width:10.6vh;
    height:10.6vh;
  }

  :fullscreen #blueBtn,
  :-webkit-full-screen #blueBtn {
    width:10.6vh;
    height:10.6vh;
  }
</style>
</head>
<body>

<div class="video-viewport" id="viewport">
  <video id="video"
         playsinline
         webkit-playsinline
         preload="auto"
         src="Pause1.mp4#t=0.001"></video>

  <button id="playBtn">▶</button>
  <button id="yellowBtn"></button>
  <button id="blueBtn"></button>
</div>

<script>
  const viewport = document.getElementById("viewport");
  const video = document.getElementById("video");
  const playBtn = document.getElementById("playBtn");
  const yellowBtn = document.getElementById("yellowBtn");
  const blueBtn = document.getElementById("blueBtn");
  const vidList = {
    'Pause1.mp4': {top: '50%', next: 'Seq1.mp4'},
    'Seq1.mp4': {next: 'Pause2.mp4'},
    'Pause2.mp4': {top: '21%', yellow:'Seq2.mp4', blue: 'Seq3.mp4'},
    'Seq2.mp4': {next: 'Pause1.mp4'},
    'Seq3.mp4': {next: 'Pause3.mp4'},
    'Pause3.mp4': {top: '16.5%', yellow:'Seq4.mp4', blue: 'Seq5.mp4'},
    'Seq4.mp4': {next: 'Pause4.mp4'},
    'Seq5.mp4': {next: 'Seq8.mp4'},
    'Pause4.mp4': {top: '16.5%', yellow:'Seq6.mp4', blue: 'Seq7.mp4'},
    'Seq6.mp4': {next: 'Pause1.mp4'},
    'Seq7.mp4': {next: 'Seq8.mp4'},
    'Seq8.mp4': {next: 'Pause5.mp4'},
    'Pause5.mp4': {top: '82.7%', yellow:'Seq9.mp4', blue: 'Seq10.mp4'},
    'Seq9.mp4': {next: 'Pause1.mp4'},
    'Seq10.mp4': {next: 'Pause6.mp4'},
    'Pause6.mp4': {top: '86.7%', yellow:'Seq11.mp4', blue: 'Seq12.mp4'},
    'Seq11.mp4': {next: 'Pause7.mp4'},
    'Seq12.mp4': {next: 'Pause8.mp4'},
    'Pause7.mp4': {top: '86.7%', yellow:'Seq14.mp4', blue: 'Seq15.mp4'},
    'Pause8.mp4': {top: '76.4%', yellow:'Seq13.mp4', blue: 'Seq16.mp4'},
    'Seq13.mp4': {next: 'Pause1.mp4'},
    'Seq14.mp4': {next: 'Pause1.mp4'},
    'Seq15.mp4': {next: 'Seq17.mp4'},
    'Seq16.mp4': {next: 'Seq17.mp4'},
    'Seq17.mp4': {next: 'Pause9.mp4'},
    'Pause9.mp4': {top: '37%', yellow:'Seq18.mp4', blue: 'Seq19.mp4'},
    'Seq18.mp4': {next: 'Pause10.mp4'},
    'Seq19.mp4': {next: 'Pause11.mp4'},
    'Pause10.mp4': {top: '45.8%', yellow:'Seq20.mp4', blue: 'Seq21.mp4'},
    'Pause11.mp4': {top: '16.8%', yellow:'Seq22.mp4', blue: 'Seq23.mp4'},
    'Seq20.mp4': {next: 'Pause1.mp4'},
    'Seq21.mp4': {next: 'Pause1.mp4'},
    'Seq22.mp4': {next: 'Pause1.mp4'},
    'Seq23.mp4': {next: 'Pause1.mp4'}
  }
  var playing = 'Pause1.mp4';

  /* ---------------------------------------------------
     1. FORCE PORTRAIT ORIENTATION IN FULLSCREEN
     --------------------------------------------------- */
  function lockPortrait() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("portrait").catch(() => {});
    }
  }

  /* ---------------------------------------------------
     2. UNIVERSAL FULLSCREEN ENTRY
     --------------------------------------------------- */
  async function enterFullscreen() {
    lockPortrait();

    // iPhone native fullscreen
    if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
      return;
    }

    // Standard fullscreen
    const req =
      viewport.requestFullscreen ||
      viewport.webkitRequestFullscreen ||
      viewport.mozRequestFullScreen ||
      viewport.msRequestFullscreen;

    if (req) req.call(viewport);
  }

  /* ---------------------------------------------------
     3. ALWAYS FIT VIDEO TO THE *REAL VISIBLE SCREEN*
     (Works on iPhone Safari dynamic viewport)
     --------------------------------------------------- */
  function resizeViewport() {
    const visibleHeight = window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;

    viewport.style.height = visibleHeight + "px";
  }

  /* Initial sizing */
  resizeViewport();

  /* Update on any viewport change */
  window.visualViewport?.addEventListener("resize", resizeViewport);
  window.addEventListener("orientationchange", () => {
    setTimeout(resizeViewport, 300); // allow UI bars to animate
  });
  document.addEventListener("fullscreenchange", resizeViewport);

  /* ---------------------------------------------------
     4. BUTTON BEHAVIOR
     --------------------------------------------------- */
  playBtn.addEventListener("click", () => {
    video.src = 'Seq1.mp4';
  	playing = 'Seq1.mp4';
    enterFullscreen();
    video.play();
    playBtn.style.display = "none";
  });
  yellowBtn.addEventListener("click", () => {
    yellowBtn.style.display = 'none';
    blueBtn.style.display = 'none';
    playing = vidList[playing]['yellow'];
    video.src = playing;
    video.play();
  });
  blueBtn.addEventListener("click", () => {
    yellowBtn.style.display = 'none';
    blueBtn.style.display = 'none';
    playing = vidList[playing]['blue'];
    video.src = playing;
    video.play();
  });
/*
  playBtn.addEventListener("click", async () => {
    // Toggle play/pause
    if (video.paused) {
      await video.play();
      playBtn.textContent = "❚❚";
    } else {
      video.pause();
      playBtn.textContent = "▶";
    }

    // Enter fullscreen always
    enterFullscreen();
  });
  
  video.addEventListener("play", () => {
    playBtn.textContent = "❚❚";
  });

  video.addEventListener("pause", () => {
    playBtn.textContent = "▶";
  });
*/

  /* ---------------------------------------------------
     4. MANAGE TRANSITIONS
     --------------------------------------------------- */
  video.addEventListener('ended', () => {
    if (playing.includes('Pause')) {
	  video.src = playing;  // loop until a button is pressed
      video.play();
  	}
  	else {
  	  playing = vidList[playing]['next'];
  	  video.src = playing;
      video.play();
  	  if (playing.includes('Pause1.')) {
  	    playBtn.style.display = "flex";
  	  }
  	  else if (playing.includes('Pause')) {
  	    yellowBtn.style.top = vidList[playing]['top'];
  	    blueBtn.style.top = vidList[playing]['top'];
  	    yellowBtn.style.display = 'flex';
  	    blueBtn.style.display = 'flex';
  	  }
  	}
  });
</script>

</body>
</html>
