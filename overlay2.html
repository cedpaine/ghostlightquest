<!doctype html>
<html lang="en">
<head>
<!--
ChatGTP prompt:
css, html, and javascript for a video with a circular button overlay covering 30% of the 
width of the video. The video should be in portrait mode with a 9:16 aspect ratio. There 
should be a full screen button that displays the entire video with the overlay button 
still in place.
-->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portrait Video with Circular Overlay</title>
  <style>
    :root{
      --bg:#111;
      --accent: rgba(255,255,255,0.92);
      --accent-2: rgba(0,0,0,0.35);
    }

    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#0b0b0b,#121212);color:var(--accent)}

    .page-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}

    /* video container kept at portrait 9:16 aspect ratio */
    .video-container{
      position:relative;
      width:360px;               /* base width - scales down on small screens */
      max-width:40vw;
      aspect-ratio:9/16;         /* keeps portrait ratio */
      background:var(--bg);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 20px 40px rgba(0,0,0,0.6);
      display:flex;align-items:center;justify-content:center;
    }

    /* make container larger on bigger viewports */
    @media (min-width:900px){
      .video-container{max-width:320px;width:22vw}
    }

    video{
      width:100%;height:100%;object-fit:cover;display:block;
      background: black;
    }

    /* circular overlay button: 30% of the width of the video container */
    .overlay-btn{
      position:absolute;
      width:30%;                /* EXACT requirement: covers 30% of the video's width */
      aspect-ratio:1/1;         /* keep it a perfect circle */
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      transition:transform 180ms ease, box-shadow 180ms ease;
      box-shadow:0 8px 24px rgba(0,0,0,0.6);
      background:linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* choose default location of the overlay — centered by default */
    .overlay-btn.center{
      left:50%;top:50%;transform:translate(-50%,-50%);
    }

    /* other convenient presets (user can change by swapping classname) */
    .overlay-btn.top-right{right:10%;top:10%;transform:translate(0,0)}
    .overlay-btn.bottom-left{left:10%;bottom:10%;transform:translate(0,0)}

    .overlay-btn:active{transform:scale(0.96)}

    .overlay-icon{
      font-size:calc(0.35 * 30vw);
      pointer-events:none;
      color:var(--accent);
    }

    .overlay-label{
      position:absolute;bottom:-3.25rem;left:50%;transform:translateX(-50%);
      font-size:13px;color:rgba(255,255,255,0.85);
      background:rgba(0,0,0,0.42);padding:6px 10px;border-radius:8px;white-space:nowrap;
      display:none;
    }

    .overlay-btn[data-show-label="true"] + .overlay-label{display:block}

    /* fullscreen button (outside the container) */
    .controls{display:flex;gap:12px;align-items:center;margin-top:12px;justify-content:center}
    .btn{
      padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:var(--accent);cursor:pointer
    }

    /* ensure overlay stays in same relative position when container is fullscreen */
    .video-container:fullscreen{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
    .video-container:-webkit-full-screen{width:100%;height:100%;aspect-ratio:auto;border-radius:0}

    /* small responsive tweak to keep overlay-icon sizing sensible */
    @media (max-width:420px){
      .video-container{width:280px}
      .overlay-btn{width:30%}
    }

    /* accessibility focus styles */
    .overlay-btn:focus{outline:3px solid rgba(255,255,255,0.12);outline-offset:4px}
    .btn:focus{outline:3px solid rgba(255,255,255,0.08);outline-offset:3px}
  </style>
</head>
<body>
  <div class="page-wrap">
    <div>
      <div class="video-container" id="container">
        <!-- Replace src with your portrait video (mp4/webm) that has a 9:16 frame -->
        <video id="theVideo" playsinline preload="metadata" poster="" tabindex="0">
          <source src="Pause1.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>

        <!-- Circular overlay button. Swap classes (center/top-right/...) to reposition. -->
        <button id="overlay" class="overlay-btn center" aria-label="Overlay action" data-show-label="true">
          <!-- Simple play icon using SVG (keeps it crisp) -->
          <svg class="overlay-icon" width="64" height="64" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M8 5v14l11-7z"></path>
          </svg>
        </button>
        <div class="overlay-label" id="overlayLabel">Play / Pause</div>
      </div>

      <div class="controls" style="margin-top:14px">
        <button id="fsBtn" class="btn" title="Toggle Fullscreen">⤢ Fullscreen</button>
        <button id="muteBtn" class="btn" title="Mute / Unmute">Mute</button>
        <button id="jumpBtn" class="btn" title="Jump 10s">+10s</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const video = document.getElementById('theVideo');
    const overlay = document.getElementById('overlay');
    const fsBtn = document.getElementById('fsBtn');
    const muteBtn = document.getElementById('muteBtn');
    const jumpBtn = document.getElementById('jumpBtn');

    // If the video file isn't supplied, pause and show a subtle message in console.
    video.addEventListener('error', () => console.warn('Video failed to load. Replace the <source> src with a real portrait video (9:16).'));

    // Clicking the circular overlay toggles play/pause
    overlay.addEventListener('click', (e) => {
      e.preventDefault();
      if (video.paused) video.play(); else video.pause();
      // reflect state by toggling an attribute used to change icon (optional)
      overlay.setAttribute('aria-pressed', String(!video.paused));
    });

    // Update overlay icon to show pause when playing
    video.addEventListener('play', () => {
      overlay.innerHTML = `\n        <svg class="overlay-icon" width="64" height="64" viewBox="0 0 24 24" aria-hidden="true">\n          <path fill="currentColor" d=\"M6 5h4v14H6zM14 5h4v14h-4z\"></path>\n        </svg>`;
    });
    video.addEventListener('pause', () => {
      overlay.innerHTML = `\n        <svg class="overlay-icon" width="64" height="64" viewBox="0 0 24 24" aria-hidden="true">\n          <path fill="currentColor" d=\"M8 5v14l11-7z\"></path>\n        </svg>`;
    });

    // Fullscreen toggles the container (so overlay stays in place)
    fsBtn.addEventListener('click', async () => {
      try{
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (container.requestFullscreen) await container.requestFullscreen();
          else if (container.webkitRequestFullscreen) await container.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
        }
      }catch(err){
        console.error('Fullscreen failed:', err);
      }
    });

    // Mute toggle
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
    });

    // Jump button
    jumpBtn.addEventListener('click', () => {
      video.currentTime = Math.min(video.duration || 0, (video.currentTime || 0) + 10);
    });

    // keyboard accessibility: Space toggles play/pause when focus is on video container
    container.addEventListener('keydown', (e) => {
      if (e.code === 'Space'){
        e.preventDefault();
        if (video.paused) video.play(); else video.pause();
      }
    });

    // Ensure container is focusable for keyboard handlers
    container.tabIndex = 0;

    // When entering fullscreen, browsers sometimes hide controls; keep overlay visible by ensuring it's in the container
    document.addEventListener('fullscreenchange', () => {
      // Update button label depending on state
      fsBtn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : '⤢ Fullscreen';
    });
    document.addEventListener('webkitfullscreenchange', () => {
      fsBtn.textContent = document.webkitFullscreenElement ? 'Exit Fullscreen' : '⤢ Fullscreen';
    });

    // Small helper: if the user clicks the video itself toggle play/pause
    video.addEventListener('click', () => {
      if (video.paused) video.play(); else video.pause();
    });

    // Keep overlay size consistent on resize (it uses percentage of container width via CSS) so nothing else needed
    // But for pixel-perfect control you could compute width in JS and set style.width = (container.clientWidth * 0.3) + 'px'

  </script>
</body>
</html>
