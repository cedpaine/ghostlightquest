<!doctype html>
<html lang="en">
<head>
<!-- ChatGPT Prompts:
css, html, and javascript for a video with a circular button overlay covering 30% of the 
width of the video. There should be a full screen button that displays the entire video 
with the overlay button still in place. Center the video horizontally. In full-screen, 
show the entire height of the video.
Remove width and aspect-ratio from the css for video-container. Make video-container the 
height of the available window.
-->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ghostlight Quest</title>
  <style>
    body{
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      background:#111;
      font-family:Arial;
    }

    .video-container{
      position:relative;
      height:100vh; /* fill available window height */
      background:#000;
      overflow:hidden;
      margin:0 auto; /* center horizontally */
      display:flex;
      justify-content:center;
      align-items:center;
    }

    video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .start-btn{
      position:absolute;
      height:10%;           /* 10% of video height */
      aspect-ratio:1/1;    /* circle */
      border-radius:50%;
      background:rgba(255,255,255,0);
      top:53%;
      left:50%;
      transform:translate(-50%, -50%);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      font-size:28px;
      font-weight:bold;
      user-select:none;
    }

    .yellow-btn{
      position:absolute;
      height:10.6%;           /* 10% of video height */
      aspect-ratio:1/1;    /* circle */
      border-radius:50%;
      background:rgba(255,255,255,0);
      top:0%;
      left:50%;
      transform:translateX(-145%);
      display:none;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      font-size:28px;
      font-weight:bold;
      user-select:none;
    }

    .blue-btn{
      position:absolute;
      height:10.6%;           /* 10% of video height */
      aspect-ratio:1/1;    /* circle */
      border-radius:50%;
      background:rgba(255,255,255,0);
      top:0%;
      left:50%;
      transform:translateX(48%);
      display:none;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      font-size:28px;
      font-weight:bold;
      user-select:none;
    }

    /* Fullscreen keeps buttons positioned */
    .video-container:fullscreen{
      width:100vw; */
      height:100vh;
      aspect-ratio:auto;
    }

    .controls{
      text-align:center;
      margin-top:16px;
    }
  
    /* fullscreen video should show entire height */
    .video-container:fullscreen video{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .video-container:-webkit-full-screen video{
      width:100%;
      height:100%;
      object-fit:contain;
    }
  </style>
</head>
<body>
  <div>
    <div class="video-container" id="vidBox">
      <video id="video" playsinline autoplay>
        <source src="Pause1.mp4" type="video/mp4">
      </video>
      <div class="start-btn" id="startBtn">▶</div>
      <div class="yellow-btn" id="yellowBtn"></div>
      <div class="blue-btn" id="blueBtn"></div>
    </div>
  </div>

  <script>
    var playing = 'Pause1.mp4';
console.log(playing);
    const vidList = {
    	'Pause1.mp4': {top: '50%', next: 'Seq1.mp4'},
    	'Seq1.mp4': {next: 'Pause2.mp4'},
    	'Pause2.mp4': {top: '21%', yellow:'Seq2.mp4', blue: 'Seq3.mp4'},
    	'Seq2.mp4': {next: 'Pause1.mp4'},
    	'Seq3.mp4': {next: 'Pause3.mp4'},
    	'Pause3.mp4': {top: '16.5%', yellow:'Seq4.mp4', blue: 'Seq5.mp4'},
    	'Seq4.mp4': {next: 'Pause4.mp4'},
    	'Seq5.mp4': {next: 'Seq8.mp4'},
    	'Pause4.mp4': {top: '16.5%', yellow:'Seq6.mp4', blue: 'Seq7.mp4'},
    	'Seq6.mp4': {next: 'Pause1.mp4'},
    	'Seq7.mp4': {next: 'Seq8.mp4'},
    	'Seq8.mp4': {next: 'Pause5.mp4'},
    	'Pause5.mp4': {top: '82.7%', yellow:'Seq9.mp4', blue: 'Seq10.mp4'},
    	'Seq9.mp4': {next: 'Pause1.mp4'},
    	'Seq10.mp4': {next: 'Pause6.mp4'},
    	'Pause6.mp4': {top: '86.7%', yellow:'Seq11.mp4', blue: 'Seq12.mp4'},
    	'Seq11.mp4': {next: 'Pause7.mp4'},
    	'Seq12.mp4': {next: 'Pause8.mp4'},
    	'Pause7.mp4': {top: '86.7%', yellow:'Seq14.mp4', blue: 'Seq15.mp4'},
    	'Pause8.mp4': {top: '76.4%', yellow:'Seq13.mp4', blue: 'Seq16.mp4'},
    	'Seq13.mp4': {next: 'Pause1.mp4'},
    	'Seq14.mp4': {next: 'Pause1.mp4'},
    	'Seq15.mp4': {next: 'Seq17.mp4'},
    	'Seq16.mp4': {next: 'Seq17.mp4'},
    	'Seq17.mp4': {next: 'Pause9.mp4'},
    	'Pause9.mp4': {top: '39.4%', yellow:'Seq18.mp4', blue: 'Seq19.mp4'},
    	'Seq18.mp4': {next: 'Pause10.mp4'},
    	'Seq19.mp4': {next: 'Pause11.mp4'},
    	'Pause10.mp4': {top: '45.5%', yellow:'Seq20.mp4', blue: 'Seq21.mp4'},
    	'Pause11.mp4': {top: '16.8%', yellow:'Seq22.mp4', blue: 'Seq23.mp4'},
    	'Seq20.mp4': {next: 'Pause1.mp4'},
    	'Seq21.mp4': {next: 'Pause1.mp4'},
    	'Seq22.mp4': {next: 'Pause1.mp4'},
    	'Seq23.mp4': {next: 'Pause1.mp4'}
    	}
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const yellowBtn = document.getElementById("yellowBtn");
    const blueBtn = document.getElementById("blueBtn");
    const vidBox = document.getElementById("vidBox");
    
    video.addEventListener('ended', () => {
    	if (playing.includes('Pause')) {
    		video.src = playing;  // loop until a button is pressed
  		}
  		else {
  			playing = vidList[playing]['next'];
console.log(playing);
  			video.src = playing;
  			if (playing.includes('Pause')) {
  				if (playing.includes('Pause1.')) {
        			startBtn.style.display = "flex";
        		}
        		else {
        			yellowBtn.style.top = vidList[playing]['top'];
        			blueBtn.style.top = vidList[playing]['top'];
        			yellowBtn.style.display = 'flex';
        			blueBtn.style.display = 'flex';
        		}
  			}
  		}
	});

    startBtn.addEventListener("click", () => {
      	video.src = 'Seq1.mp4';
  		playing = 'Seq1.mp4';
console.log(playing);
        vidBox.requestFullscreen();
        video.play();
        startBtn.style.display = "none";
    });
    yellowBtn.addEventListener("click", () => {
        yellowBtn.style.display = 'none';
        blueBtn.style.display = 'none';
        playing = vidList[playing]['yellow'];
console.log(playing);
    	video.src = playing;
        video.play();
    });
    blueBtn.addEventListener("click", () => {
        yellowBtn.style.display = 'none';
        blueBtn.style.display = 'none';
    	playing = vidList[playing]['blue'];
console.log(playing);
    	video.src = playing;
        video.play();
    });
  </script>
</body>
</html>
